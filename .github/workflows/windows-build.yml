name: Windows experimental avatar editor build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements.txt pytest==8.4.2 pyinstaller==6.16.0
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python tools/collect_licenses.py
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name WeChatLocalProfileEditor --collect-all sqlcipher3 --copy-metadata sqlcipher3 --add-data "third_party;third_party" main.py
      - name: Test the frozen EXE against an artificial encrypted database
        shell: pwsh
        run: |
          $process = Start-Process -FilePath '.\dist\WeChatLocalProfileEditor.exe' -ArgumentList '--self-test', 'executable-selftest.json' -WorkingDirectory $pwd.Path -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Frozen executable self-test failed' }
          $report = Get-Content executable-selftest.json -Raw | ConvertFrom-Json
          if (-not $report.ok) { throw 'Frozen executable reported failure' }
          Get-Content executable-selftest.json
      - uses: actions/upload-artifact@v4
        with:
          name: WeChatLocalProfileEditor-compatibility-4.1.15.65
          path: |
            dist/WeChatLocalProfileEditor.exe
            executable-selftest.json
            README.md
            third_party/
